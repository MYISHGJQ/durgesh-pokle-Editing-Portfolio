<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#181818" />
            <stop offset="100%" stop-color="#080808" />
        </radialGradient>
    </defs>
    <!-- Background Circle -->
    <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#f3a218" stroke-width="2" stroke-opacity="0.3" />
    
    <!-- Monogram DP -->
    <text x="32" y="44" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="-1">DP</text>
</svg>
